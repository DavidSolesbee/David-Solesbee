# Firebase App Hosting configuration — Perseus Equipment Intelligence.
#
# App Hosting is Firebase's product for server-rendered Next.js. This file makes
# the project Firebase-ready. NOT deployed yet (per project decision).
#
# IMPORTANT architecture note (to resolve before first deploy):
#   - Perseus currently uses Node's built-in `node:sqlite` against LOCAL files:
#       * a large READ-ONLY dealership database, and
#       * a writable app store at data/perseus_app.db.
#     App Hosting runs on Cloud Run with an EPHEMERAL filesystem, so the app
#     store will not persist and the large read-only DB cannot simply live on
#     local disk across instances. Before deploying we must move the app store
#     to a managed database (e.g. Cloud SQL / Firestore) and decide how the
#     dealership data is served (Cloud SQL copy, or a read replica). All access
#     already flows through getAppDb()/getDealershipDb(), so this swap is
#     contained to the db layer.
#   - `node:sqlite` requires Node 24+. Confirm the App Hosting runtime supports
#     the pinned Node version (see package.json "engines") before deploying.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 2
  memoryMiB: 4096

# Dealership SQLite is fetched from the GitHub Release at build time
# (see scripts/fetch-dealership-db.mjs). The writable app store is created
# on the instance at runtime.
env:
  - variable: PERSEUS_DEALERSHIP_DB
    value: perseus_equipment_database.db
    availability:
      - BUILD
      - RUNTIME
  - variable: PERSEUS_DEALERSHIP_DB_URL
    value: https://github.com/DavidSolesbee/David-Solesbee/releases/download/dealership-data/perseus_equipment_database.db
    availability:
      - BUILD

